<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">PreSew's two-stage YouCam pipeline</title>
  <desc id="description">Fabric and style references enter YouCam garment preparation. The prepared garment and original person photo enter YouCam Clothes V4. The completed result is retained as a private outfit preview.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#886471"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #25231f; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #5c2d3c; }
      .heading { font-size: 32px; font-weight: 600; }
      .label { font-size: 23px; font-weight: 600; }
      .note { font-size: 18px; fill: #6a605e; }
      .light { fill: #fffaf5; }
      .muted-light { fill: #e6d5dc; }
      .edge { fill: none; stroke: #886471; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="648" rx="20" fill="#f6f3ed" stroke="#ded9d1"/>
  <text x="42" y="46" class="eyebrow">PRESEW / YOUCAM INTEGRATION</text>
  <text x="42" y="93" class="heading">From fabric to fitting room</text>
  <text x="42" y="126" class="note">Two connected stages, starting from the user's chosen references.</text>

  <path d="M290 213H330V280H380" class="edge"/>
  <path d="M290 343H330V280H380" class="edge"/>
  <path d="M680 280H730V340H780" class="edge"/>
  <path d="M290 508H705V380H780" class="edge"/>
  <path d="M955 410V480" class="edge"/>

  <rect x="42" y="170" width="248" height="86" rx="12" fill="#fffdf9" stroke="#d7cec8"/>
  <text x="66" y="207" class="label">Fabric reference</text>
  <text x="66" y="235" class="note">Colors and motifs</text>
  <rect x="42" y="300" width="248" height="86" rx="12" fill="#fffdf9" stroke="#d7cec8"/>
  <text x="66" y="337" class="label">Style reference</text>
  <text x="66" y="365" class="note">Silhouette and details</text>
  <rect x="42" y="465" width="248" height="86" rx="12" fill="#fffdf9" stroke="#d7cec8"/>
  <text x="66" y="502" class="label">Original photo</text>
  <text x="66" y="530" class="note">Person input for try-on</text>

  <rect x="380" y="210" width="300" height="140" rx="14" fill="#5c2d3c"/>
  <text x="406" y="245" class="eyebrow muted-light">STAGE 01</text>
  <text x="406" y="282" class="label light">Prepare the garment</text>
  <text x="406" y="315" class="note muted-light">YouCam Image Generator V2</text>
  <text x="688" y="227" class="note">Prepared</text>
  <text x="688" y="250" class="note">garment</text>

  <rect x="780" y="270" width="350" height="140" rx="14" fill="#5c2d3c"/>
  <text x="806" y="305" class="eyebrow muted-light">STAGE 02</text>
  <text x="806" y="342" class="label light">Try it on the person</text>
  <text x="806" y="375" class="note muted-light">YouCam Clothes V4</text>
  <rect x="780" y="480" width="350" height="86" rx="12" fill="#e9e0e3" stroke="#cdbbc2"/>
  <text x="806" y="517" class="label">Private outfit preview</text>
  <text x="806" y="545" class="note">Compare, explore, and download</text>

  <path d="M42 595H1158" stroke="#ded9d1"/>
  <text x="42" y="624" class="note">Processing consent comes first. The provider API key stays on the server.</text>
</svg>
