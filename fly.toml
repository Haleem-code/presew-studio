# Set app and BETTER_AUTH_URL to your chosen Fly app name before deploying.
app = "presew-studio"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  BETTER_AUTH_URL = "https://presew-studio.fly.dev"
  PRIVATE_STORAGE_PATH = "/data/assets"
  MAX_RENDERS_PER_DAY = "5"

[deploy]
  release_command = "bun server/migrate.ts"
  strategy = "rolling"

[[mounts]]
  source = "presew_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
